# Mochi v5 settings. Each block is one node's config_key from
# jaeger.toml; the framework hands the block to that node's factory.

animation:
  # The face's render geometry. A window is free to display it larger;
  # this is what the engine actually rasterises.
  width: 256
  height: 256

player:
  # Which character to load at boot. A character is a self-contained
  # folder with its own character.yaml — see the pack format in
  # JaegerAnimation.
  character: emotes
  # Wall-clock seconds each expression holds in the idle cycle. v5.0
  # has no mind to pick expressions, so it walks them.
  dwell_s: 1.5
  scale: 2
