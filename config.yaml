infrastructure:
  broker:
    frontend_addr: "tcp://127.0.0.1:5555"
    backend_addr: "tcp://127.0.0.1:5557"
  monitor:
    rep_address: "tcp://127.0.0.1:5560"
  gui:
    ctrl_address: "tcp://127.0.0.1:5556"
  display:
    sub_address: "tcp://127.0.0.1:5555"
    zoom: 4
    poll_ms: 5

plugins:
  - id: "animation"
    type: "animation_node"
    module: "nodes.animation.node"
    cwd: "nodes/animation"
    config_path: "nodes/animation/config.yaml"
    enabled: true
  - id: "llm"
    type: "llm_node"
    module: "agent.llm.node"
    cwd: "agent/llm"
    config_path: "agent/llm/config.yaml"
    enabled: true
  - id: "mochi_gui"
    type: "gui"
    entry: "gui/mochi_gui.py"
    cwd: "gui"
    enabled: true
