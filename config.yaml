# Mochi Configuration

node:
  logical_width: 64
  logical_height: 64
  fps: 60
  pub_address: "tcp://127.0.0.1:5555"
  ctrl_address: "tcp://127.0.0.1:5556"
  default_mode: "idle"

gui:
  pub_address: "tcp://127.0.0.1:5556"

display:
  sub_address: "tcp://127.0.0.1:5555"
  zoom: 1  # The pixel scaling factor for the virtual display window.
  poll_ms: 5
