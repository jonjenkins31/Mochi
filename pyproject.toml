# Mochi v5 — packaging.
#
# Depends on the FRAMEWORK and the modules it composes, never the other
# way round. Nothing imports mochi.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi"
description = "A virtual character you can run — a JaegerOS app."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["version"]
dependencies = [
  # The framework: bus, app manifest, node lifecycle, contract.
  "jaeger-os @ git+https://github.com/JenkinsRobotics/JaegerOS@master",
  # The face. Bound by SLOT in jaeger.toml — this dependency installs
  # an animation-slot module; the manifest never names it.
  "jaeger-animation @ git+https://github.com/JenkinsRobotics/JaegerAnimation@master",
  # The window. PySide6 is the ecosystem's standard cross-platform GUI.
  "pyside6>=6.5",
  "pyyaml>=6.0",
]

[project.scripts]
mochi = "mochi.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.dynamic]
version = { attr = "mochi.__version__" }

[tool.setuptools.packages.find]
include = ["mochi*"]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
