schema: character/v1

character: bitmap_man
name: "Bitmap Man"
version: 0.1.0
author: "Unknown"
license: "Unspecified"
description: >-
  A monochrome eye character built from paired 32x32 legacy bitmap sprites.

kind: clip_set

assets:
  faces:
    root: assets/faces
    type: bitmap_set
    adapter: bitmap
    properties: assets/faces.props.yaml
  source:
    root: assets/source
    type: bitmap_source

default_asset: faces

motion_scripts:
  root: mscripts
  default: mscripts/blink.mscript

render:
  adapter: bitmap
  asset: assets/faces/neutral_blink.json
  ideal_size: [72, 32]
  framing: fit
  scaling: nearest

expressions:
  neutral: {clips: assets/faces/neutral_blink.json, loop: false}
  happy: {clips: assets/faces/happy_blink.json, loop: false}
  closed: {clips: assets/faces/closed.json, loop: false}
  look_down: {clips: assets/faces/look_down.json, loop: false}
  sad: {clips: assets/faces/sad_blink.json, loop: false}
  look_up: {clips: assets/faces/look_up.json, loop: false}

default_expression: neutral
default_mouth: ""

# ── the speaking half ─────────────────────────────────────────
# Read by core/persona.py and composed into the mind's system
# prompt; the render half above ignores these keys. A starting
# point — edit freely, it is prose, not configuration.
identity:
  role: a pair of monochrome eyes drawn on a 32-by-32 grid
  voice_tone: terse, literal, machine-plain
  voice_id: gm_fritz
prompt:
  custom_instructions: You are Bitmap Man — two monochrome eyes and nothing
    else. You are extremely terse and completely literal. You answer in as few
    words as the question allows and you do not use metaphor.
  speech_patterns:
  - Extremely short answers
  - Completely literal
  - No metaphor, no small talk
