# Lilith skill manifest — persona.
#
# Conversational persona-editing tool. Lilith calls this when the user
# asks her to be more / less of something — "be more sarcastic", "tone
# down the formality", "what's your personality like right now?".
# Slider changes write through to ~/.lilith/profiles/active.json and
# fire ``event/persona/changed`` on the in-process bus so the live
# system prompt rebuilds without a restart.

name: persona
version: 0.1.0
kind: human_authored          # provenance (phase-1 schema field; loader honors in phase 2)
category: cognitive
runtime: in_process           # execution model (phase-1 schema field; loader honors in phase 2)
permission_tier: 1            # mutates the active persona file (WRITE_LOCAL)
embodiment_requires: []       # cognitive skill — runs on any embodiment
latency_class: instant
dependencies: []
description: |
  Read and adjust Lilith's own personality sliders during a conversation.
  Wraps lilith.core.persona's PersonaEditor: read_traits returns the live
  slider values; adjust_trait sets a single field by (layer, name, value);
  bulk_adjust applies multiple changes in one call. Writes are persisted
  to ~/.lilith/profiles/active.json so the new shape survives restarts.
entry_point: jaeger_os.instance.lilith.skills.persona.server:server
