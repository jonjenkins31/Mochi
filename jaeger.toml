# Mochi — Jaeger app format manifest (format 0.1)
#
# ─────────────────────────────────────────────────────────────────
#  PATTERN 1 + TRAY (Jenkins Robotics standard, 2026-06-14)
# ─────────────────────────────────────────────────────────────────
#  macOS-native Qt app: menu bar persists when the last window
#  closes; tray icon (planned) is the always-on indicator; Cmd+Q
#  is the real quit. Same shape as Affinity, Spotify, Slack,
#  Discord, ChatGPT desktop. Single Dock icon.
#
# Phases A-E + Diagnostics-tab landed: chassis owns boot, bus,
# supervisor, surfaces. Today's Mochi behaves as Pattern 0 in
# practice (close companion = quit); flipping shell_quits_core
# to false makes it Pattern 1 — companion close keeps the menu bar
# alive, File → New Companion reopens. Tray surface declared as a
# stub; real tray wiring is follow-up work.

[app]
name = "mochi"
version = "0.1.0"
requires_framework = ">=0.1"
mode = "fused"                # single process, all windows in-shell
event_loop = "qt"             # chassis owns QApplication.exec()
ui = "pyside6"
single_instance = true        # one Dock icon, second launch refuses
autostart = false             # operator adds to Login Items if desired
shell_quits_core = false      # PATTERN 1: close window keeps app
                              # alive; menu bar persists; Cmd+Q quits
config = "config.yaml"

# Bus — ZMQ XPUB/XSUB broker. Ports preserved from config.yaml's
# `infrastructure.broker` so subprocess nodes keep talking after Phase C.
# Mochi's "frontend"/"backend" labels map: frontend=xpub (subscriber
# face), backend=xsub (publisher face) — see app/bus/zmq.py docstring.
[bus]
backend = "zmq"
xpub = "tcp://127.0.0.1:5555"
xsub = "tcp://127.0.0.1:5557"

# ── Nodes ─────────────────────────────────────────────────────────
# Both Mochi nodes run as subprocesses, supervised by the chassis.
# Restart policy is on_failure with exponential backoff + burst limit
# — strictly stronger than the run_host() that came before, which
# broke its poll loop on the first dead child.
#
# config_key picks each node's slice of config.yaml; the chassis
# hands it to the subprocess as JAEGER_NODE_CONFIG, which both nodes
# read as of Phase D (2026-06-13). The per-node config.yaml files
# (nodes/animation/config.yaml, agent/llm/config.yaml) are now gone
# — config.yaml at the repo root is the source of truth.

[[node]]
id = "animation"
tier = 3
backend = "subprocess"
module = "nodes.animation.node"
restart = "on_failure"
config_key = "animation"
enabled = true

[[node]]
id = "llm"
tier = 3
backend = "subprocess"
module = "agent.llm.node"
restart = "on_failure"
config_key = "llm"
enabled = true

# ── Surfaces ──────────────────────────────────────────────────────
# Per format §2.7 every window is an in-shell Qt window, NOT a
# subprocess. Mochi's current run_host() spawns the companion as a
# subprocess plugin — that pattern retires in Phase C when the
# companion becomes the shell's main surface inside one QApplication.

[[surface]]
id = "companion"              # the Wondershare-style companion GUI
main = true
factory = "gui.mochi_companion:run_surface"   # (planned — Phase C wires)
enabled = true

# Legacy Tk panel — superseded by the companion (see
# config.yaml's SUPERSEDE_TK_PLAN comment from commits
# 7b23cea → 1a52d1e). Kept declared so a rollback is one
# `enabled = true` away.
[[surface]]
id = "legacy_tk"
main = false
factory = "gui.mochi_gui:run_surface"          # (planned — Phase C if needed)
enabled = false

# Tray — Pattern 1 + Tray persistent surface. NSStatusBar / Qt
# QSystemTrayIcon. Declared as enabled=false today; the chassis
# Surface contract for trays needs the gui/mochi_tray.py module
# (planned) that exposes run_surface(ctx, spec) returning a
# QSystemTrayIcon. When wired: tray shows current animation,
# Library quick-pick, "Open Companion", "Quit Mochi".
[[surface]]
id = "tray"
main = false
factory = "gui.mochi_tray:run_surface"         # (planned — follow-up)
enabled = false
